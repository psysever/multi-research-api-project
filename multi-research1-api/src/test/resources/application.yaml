spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cloud:
    aws:
      access-key: test-access-key
      secret-key: test-secret-key
      region: us-east-1
      end-point: http://localhost:9000
      bucket-name-public: test-public-bucket
      bucket-name-private: test-private-bucket
      cloudfront:
        public-url: ""
        private-url: ""

  jwt:
    token:
      secret-key: test-secret-key-for-jwt-token-signing-minimum-256-bits
      access-expiration-time: 3600000
      refresh-expiration-time: 86400000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile
              - email
            redirect-uri: http://localhost:8500/login/oauth2/code/google
          facebook:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:8500/login/oauth2/code/facebook
            scope: email,public_profile
            authorization-grant-type: authorization_code

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration