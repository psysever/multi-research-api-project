<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap"
      rel="stylesheet"/>
<body>
<section style="width: 800px; padding: 0; margin: 0; overflow: hidden;">
  <article
      style="display: flex; align-items: center; padding-left: 30px; background-color: #1B3795; height: 70px">
    <img src="https://kr.object.ncloudstorage.com/inf-global/logo.png" alt="inflinkerLogo"/>
  </article>
  <article style=" padding: 30px; border-bottom: 2px solid #1B3795; background-color: #F4F8FB;">
    <div style="display: flex; align-items: center;">
      <div style="margin: 0 60px;">
        <img
            style="mix-blend-mode:darken;"
            src="https://kr.object.ncloudstorage.com/inf-global/mailbox.png" alt="inflinkerIcon"/>
      </div>
      <div>
        <p style="font-size: 24px; font-weight: bold; color: #000; margin: 0">
          Inflinker<br/>結算資訊確認結果
        </p>
        <p style="color: #666666; border-top: 1px solid #d9d9d9; padding-top: 20px;">
          很遺憾因註冊的結算資訊不符合審核條件被拒絕了。<br/>
          煩請確認後重新提審。<br/>
          謝謝。
        </p>
      </div>
    </div>
    <div style="margin-top: 30px;">
      <a
          style="display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%; height: 60px; background-color: #000; color: #fff; border-radius: 10px; cursor: pointer;"
          href="https://tw.inflinker.io"
          target="_blank"
      >
        查看Inflinker
      </a>
    </div>
  </article>
  <article class="bottomBar"
           style="padding: 20px; background-color: #f9f9f9; border-bottom: 2px solid #d9d9d9;">
    <p style="font-size: 12px; font-weight: normal; line-height: 1.83; color: #b2b2b2">
      此郵件僅供發送，無法回覆。
    </p>
    <p style="font-size: 12px; font-weight: normal; line-height: 1.83; color: #b2b2b2">
      COPYRIGHT © All rights reserved.
    </p>
  </article>
</section>
</body>
